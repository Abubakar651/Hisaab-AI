name: HisaabAI CI & Automated Verification

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./test_expenses.db
      FIREBASE_PROJECT_ID: test-hisaab-ai-project
      GROQ_API_KEY: gsk_ci_testing_dummy_key_00000000000000000000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20 (Frontend Syntax Verification)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Syntax Compilation Checks
        run: |
          echo "Checking Python byte-compilation..."
          python -m compileall -q .
          echo "Checking Frontend JavaScript syntax..."
          node --check static/app.js
          node --check static/i18n.js
          node --check static/auth.js
          node --check static/sw.js
          echo "Syntax verification passed."

      - name: Secret Leak Prevention Guard
        run: |
          echo "Auditing repository workspace for committed secrets..."
          if [ -f ".env" ]; then
            echo "ERROR: .env file detected in working directory! Secrets must never be committed."
            exit 1
          fi
          echo "Secret audit passed: No .env committed."

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short

      - name: Run Subsystem Verification Suite
        run: |
          python test_verification_suite.py

  deploy:
    name: Deploy to AWS EC2 (Production)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package Release & Upload to S3
        run: |
          git archive --format=tar.gz HEAD -o /tmp/main-release.tar.gz
          aws s3 cp /tmp/main-release.tar.gz s3://hisaab-ai-deploy-562680394100/main-release.tar.gz

      - name: Trigger Remote Deployment via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0c853339e5118d2cd \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["bash /opt/hisaab/deploy.sh"]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)
          echo "Triggered deployment Command: $COMMAND_ID"
          echo "Waiting for AWS SSM execution to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0c853339e5118d2cd \
            --region us-east-1
          echo "Deployment to AWS EC2 successfully completed!"

